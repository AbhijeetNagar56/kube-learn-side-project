# mysql.yaml
apiVersion: v1
kind: Pod
metadata:
  name: mysql
  namespace: university-app
  labels:
    app: mysql
spec:
  containers:
    - name: mysql
      image: mysql:8
      env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: mysql-root-password
        - name: MYSQL_DATABASE
          value: university
      ports:
        - containerPort: 3306
      resources:
        requests:
          memory: "256Mi"
          cpu: "250m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
  volumes:
    - name: mysql-data
      emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-svc
  namespace: university-app
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306