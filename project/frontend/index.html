<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Train Ticket Booking</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      width: 400px;
      text-align: center;
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
    }
    label {
      display: block;
      text-align: left;
      margin: 10px 0 5px;
      font-weight: bold;
      color: #444;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #45a049;
    }
    #result {
      margin-top: 20px;
      font-size: 15px;
      font-weight: bold;
      color: #2c3e50;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚆 Train Ticket Booking</h1>
    <form id="bookingForm">
      <label for="train">Train Number:</label>
      <input type="text" id="train" name="train" placeholder="e.g. 12345" required>

      <label for="passenger">Passenger Name:</label>
      <input type="text" id="passenger" name="passenger" placeholder="e.g. Abhijeet" required>

      <button type="submit">Book Ticket</button>
    </form>
    <div id="result"></div>
  </div>

  <script>
    const backendUrl = "http://backend:3000/api/book"; // service name in Docker/K8s

    document.getElementById("bookingForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const train = document.getElementById("train").value;
      const passenger = document.getElementById("passenger").value;

      try {
        const response = await fetch(backendUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ train, passenger })
        });
        const data = await response.json();
        document.getElementById("result").innerText = data.message || "Booking failed.";
      } catch (err) {
        document.getElementById("result").innerText = "❌ Error connecting to backend.";
      }
    });
  </script>
</body>
</html>
