apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-script
data:
  init.sql: |
{{ .Files.Get "files/init.sql" | indent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.db.storageSize | quote }}
---
apiVersion: v1
kind: Pod
metadata:
  name: db
  labels:
    app: uas-db
spec:
  containers:
    - name: db
      image: {{ .Values.db.image | quote }}
      env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: mysql-root-password
        - name: MYSQL_DATABASE
          value: "university"
      ports:
        - containerPort: 3306
      resources:
        requests:
          memory: "256Mi"
          cpu: "250m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      volumeMounts:
        - name: mysql-persistent-storage
          mountPath: /var/lib/mysql
        - name: init-script-volume
          mountPath: /docker-entrypoint-initdb.d
  volumes:
    - name: mysql-persistent-storage
      persistentVolumeClaim:
        claimName: mysql-pvc
    - name: init-script-volume
      configMap:
        name: db-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: uas-db-service
spec:
  selector:
    app: uas-db
  ports:
    - port: 3306
      targetPort: 3306